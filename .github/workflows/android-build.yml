name: Unity Android Build
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          targetPlatform: Android
          projectPath: .
          unityVersion: 6000.0.32f1
          buildName: LAST-HOPE
          buildsPath: build
          allowDirtyBuild: true
          customParameters: -development
      - uses: actions/upload-artifact@v4
        with:
          name: LAST-HOPE-Android-Development
          path: build
          if-no-files-found: error
          retention-days: 14
